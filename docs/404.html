<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Redirecting… · m.js</title>
<meta name="robots" content="noindex">
<style>
  body { background:#06080d; color:#8fa3bb; font:15px/1.6 system-ui,sans-serif;
         display:grid; place-items:center; min-height:100vh; margin:0; }
  a { color:#4ee2f5 }
</style>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%278%27 fill=%27%230b1018%27/%3E%3Ctext x=%2716%27 y=%2723%27 font-family=%27monospace%27 font-size=%2720%27 font-weight=%27bold%27 fill=%27%234ee2f5%27 text-anchor=%27middle%27%3Em%3C/text%3E%3C/svg%3E">
</head>
<body>
<p>Redirecting… <a id="fallback" href="/">continue</a></p>
<script>
// GitHub Pages serves this file for any path it cannot find. Two jobs:
//
//  1. Keep old inbound links working. The site used to be path-routed
//     (/guide, /api, /hmr); it is hash-routed now, so map them across.
//  2. Let the path-routing demo survive a refresh. It pushes real paths that
//     no static host can serve, so bounce back to the demo file carrying the
//     attempted path in a query — exactly the fallback the demo describes.
(function () {
  var path = location.pathname;
  // Everything before the last "/demos/" (or "/") is the site root.
  var m = path.match(/^(.*?)\/demos\//);
  var base = m ? m[1] : path.replace(/\/[^/]*$/, '');
  if (base === '/') base = '';

  document.getElementById('fallback').href = base + '/';

  if (m) {
    var rest = path.slice((base + '/demos').length) || '/';
    location.replace(base + '/demos/router-path.html?p=' + encodeURIComponent(rest) + location.search.replace('?', '&'));
    return;
  }

  var app = path.slice(base.length).replace(/\/+$/, '') || '/';
  var LEGACY = { '/guide': '#start', '/api': '#x-data', '/hmr': '#router', '/index.html': '' };
  location.replace(base + '/' + (LEGACY[app] !== undefined ? LEGACY[app] : ''));
})();
</script>
</body>
</html>
