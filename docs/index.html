<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>m.js v3 — Alpine parity, trade-offs &amp; compromises</title>
<style>
  :root {
    --bg: #06080d; --bg-2: #0b1018; --panel: #0e141f; --panel-2: #121a27;
    --line: #1d2937; --line-2: #263449;
    --ink: #e6edf5; --dim: #8fa3bb; --dimmer: #5d6f88;
    --cyan: #4ee2f5; --pink: #ff77c8; --violet: #a98bff;
    --green: #5ce6a8; --amber: #ffc861; --red: #ff7a7a;
    --mono: "MonoLisa", "JetBrains Mono", Menlo, Monaco, Consolas, "Liberation Mono", monospace;
    --sans: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --code-size: 12.5px; --code-lh: 1.62; --code-pad: 13px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--ink); font-family: var(--sans);
    font-size: 15px; line-height: 1.55; overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* ---------------------------------------------------------------- shell */
  #shell { display: grid; grid-template-columns: auto 1fr; height: 100%; min-height: 0; }
  #rail {
    width: 264px; min-height: 0; display: flex; flex-direction: column;
    background: linear-gradient(180deg, var(--bg-2), #070a10);
    border-right: 1px solid var(--line); overflow: hidden; padding: 18px 0 0;
    transition: width .22s cubic-bezier(.4,0,.2,1);
  }
  #rail nav { flex: 1 1 auto; min-height: 0; overflow-y: auto; overflow-x: hidden;
    padding-bottom: 40px; transition: opacity .16s ease; }
  #shell.railclosed #rail { width: 52px; }
  #shell.railclosed #rail nav { opacity: 0; pointer-events: none; }
  #rail nav::-webkit-scrollbar { width: 8px; }
  #rail nav::-webkit-scrollbar-thumb { background: #1b2634; border-radius: 4px; }

  /* Fixed height so collapsing the rail — or removing the old wordmark —
     never shifts the first group label or anything below it. */
  .railtop { height: 56px; display: flex; align-items: center; padding: 0 13px; flex: 0 0 auto; }
  .rail-btn {
    width: 26px; height: 26px; display: grid; place-items: center; flex: 0 0 auto;
    border-radius: 8px; cursor: pointer; color: var(--dimmer);
    background: var(--panel); border: 1px solid var(--line-2); transition: all .15s;
  }
  .rail-btn:hover { color: var(--cyan); border-color: rgba(78,226,245,.45); background: rgba(78,226,245,.08); }
  .rail-btn svg { width: 15px; height: 15px; }
  .rail-btn .bar { transition: transform .22s ease; transform-origin: 10px 10px; }
  #shell.railclosed .rail-btn .bar { transform: translateX(-5.5px); }

  .group-label {
    padding: 16px 20px 7px; font-size: 10px; letter-spacing: .13em;
    text-transform: uppercase; color: var(--dimmer); font-weight: 650;
  }
  .nav-item {
    display: flex; align-items: center; gap: 9px; width: 100%; text-align: left;
    padding: 6px 20px; background: none; border: 0; cursor: pointer;
    font-family: var(--mono); font-size: 12.5px; color: var(--dim);
    border-left: 2px solid transparent; transition: background .12s, color .12s;
  }
  .nav-item:hover { background: rgba(78,226,245,.05); color: var(--ink); }
  .nav-item.on { background: rgba(78,226,245,.09); color: var(--cyan); border-left-color: var(--cyan); }
  .dot { width: 6px; height: 6px; border-radius: 50%; flex: 0 0 auto; }
  .dot.parity { background: var(--green); }  .dot.extended { background: var(--cyan); }
  .dot.tradeoff { background: var(--amber); } .dot.partial { background: var(--violet); }
  .dot.missing { background: var(--red); }    .dot.meta { background: var(--dimmer); }

  /* ---------------------------------------------------------------- stage */
  #main { position: relative; display: flex; flex-direction: column; min-width: 0; min-height: 0; overflow: hidden; }
  #bar { height: 3px; background: #0f1620; flex: 0 0 auto; }
  #bar > i { display: block; height: 100%; background: linear-gradient(90deg, var(--cyan), var(--pink)); transition: width .3s cubic-bezier(.4,0,.2,1); }
  #stage {
    flex: 1 1 0; min-height: 0; overflow-y: auto; overscroll-behavior: contain;
    padding: 0 44px 40px; outline: none;
  }
  #stage::-webkit-scrollbar { width: 10px; }
  #stage::-webkit-scrollbar-thumb { background: #1b2634; border-radius: 5px; }

  .slide { animation: rise .26s ease-out; max-width: 1560px; margin: 0 auto; }
  @keyframes rise { from { opacity: 0 } to { opacity: 1 } }

  .slide-head { padding: 22px 0 14px; }

  /* The pinned bar is an OVERLAY, not part of the scroll flow.
     A sticky header that collapses changes document height, and Chrome's
     scroll anchoring then compensates by subtracting exactly that much from
     scrollTop — which, from a small offset, snaps you back to the top and
     makes the page feel unscrollable. Taking it out of flow means layout
     never moves, so scrolling is plain and predictable. */
  #pin {
    position: absolute; top: 3px; left: 0; right: 10px; z-index: 8;
    display: none; align-items: baseline; gap: 14px; flex-wrap: nowrap;
    padding: 10px 44px 11px; background: var(--bg);
    border-bottom: 1px solid var(--line); box-shadow: 0 10px 20px -14px #000;
  }
  #pin .kicker, #pin h2, #pin .pill { flex: 0 0 auto; }
  /* Truncates rather than wrapping — the bar must stay one line tall. */
  #pin .pintag {
    flex: 1 1 auto; min-width: 0; color: var(--dimmer); font-size: 13px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  #pin .pintag code { color: var(--pink); font-family: var(--mono); font-size: .9em; }
  @media (max-width: 900px) { #pin .pintag { display: none; } }
  #pin.on { display: flex; }
  #pin h2 { font-family: var(--mono); font-size: 21px; font-weight: 700; letter-spacing: -.02em; color: #fff; }
  #pin h2 .sigil { color: var(--pink); }
  @media (max-width: 1020px) { #pin { padding: 9px 18px 10px; } }

  .kicker { font-family: var(--mono); font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--dimmer); }
  .title-row { display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap; margin: 6px 0 8px; }
  h2.name { font-family: var(--mono); font-size: 36px; font-weight: 700; letter-spacing: -.02em; color: #fff; }
  h2.name .sigil { color: var(--pink); }
  .tagline { font-size: 16.5px; color: var(--dim); max-width: 78ch; }

  .pill { font-size: 10.5px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; padding: 4px 10px; border-radius: 999px; border: 1px solid; }
  .pill.parity   { color: var(--green);  border-color: rgba(92,230,168,.4);  background: rgba(92,230,168,.09); }
  .pill.extended { color: var(--cyan);   border-color: rgba(78,226,245,.4);  background: rgba(78,226,245,.09); }
  .pill.tradeoff { color: var(--amber);  border-color: rgba(255,200,97,.4);  background: rgba(255,200,97,.09); }
  .pill.partial  { color: var(--violet); border-color: rgba(169,139,255,.4); background: rgba(169,139,255,.09); }
  .pill.missing  { color: var(--red);    border-color: rgba(255,122,122,.4); background: rgba(255,122,122,.09); }

  /* -------------------------------------------------------------- panels */
  .cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(400px,100%), 1fr)); gap: 14px; margin-bottom: 16px; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 11px; overflow: hidden; display: flex; flex-direction: column; }
  .panel > header, .lab > div > header {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 8px 13px; background: var(--panel-2); border-bottom: 1px solid var(--line);
    font-family: var(--mono); font-size: 10.5px; letter-spacing: .12em;
    text-transform: uppercase; color: var(--dim); flex: 0 0 auto;
  }
  .panel > header .who { display: flex; align-items: center; gap: 7px; }
  .panel > header .tick { width: 7px; height: 7px; border-radius: 2px; }
  .panel.alpine > header .tick { background: #77c1d2; }
  .panel.v2 > header .tick { background: var(--violet); }
  .panel.v3 > header .tick { background: var(--cyan); }
  .panel .foot { padding: 9px 13px; border-top: 1px dashed var(--line); color: var(--dim); font-size: 12.5px; }

  pre.code { margin: 0; padding: var(--code-pad); overflow-x: auto; font-family: var(--mono); font-size: var(--code-size); line-height: var(--code-lh); flex: 1; }
  pre.code::-webkit-scrollbar { height: 8px; }
  pre.code::-webkit-scrollbar-thumb { background: #1e2a3a; border-radius: 4px; }
  .none { padding: 13px; font-size: 13px; color: var(--dimmer); font-style: italic; flex: 1; display: flex; align-items: center; }

  .t-punct { color: #63788f; } .t-tag { color: var(--pink); } .t-attr { color: #9fb6cf; }
  .t-dir { color: var(--cyan); font-weight: 600; } .t-str { color: var(--green); }
  .t-cmt { color: #4a5a70; font-style: italic; } .t-kw { color: var(--violet); }
  .t-num { color: var(--amber); } .t-fn { color: #7fd1ff; }
  .t-magic { color: var(--pink); font-weight: 600; }

  /* -------------------------------------------------------------- callout */
  .callout { border-radius: 11px; padding: 13px 16px; margin-bottom: 16px; border: 1px solid; font-size: 13.5px; }
  .callout h4 { font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; margin-bottom: 7px; font-weight: 700; }
  .callout ul { margin: 0; padding-left: 17px; }
  .callout li + li { margin-top: 5px; }
  .callout.warn { border-color: rgba(255,200,97,.3);  background: rgba(255,200,97,.06); }
  .callout.warn h4 { color: var(--amber); }
  .callout.gone { border-color: rgba(255,122,122,.3); background: rgba(255,122,122,.06); }
  .callout.gone h4 { color: var(--red); }
  .callout.info { border-color: rgba(78,226,245,.25); background: rgba(78,226,245,.05); }
  .callout.info h4 { color: var(--cyan); }

  .why { background: var(--panel); border: 1px solid var(--line); border-radius: 11px; padding: 15px 17px; margin-bottom: 14px; }
  .why h4 { font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--dimmer); margin-bottom: 9px; }
  .why p { color: var(--dim); font-size: 13.5px; max-width: 105ch; }

  /* ----------------------------------------------------------------- lab */
  .lab {
    display: grid; grid-template-columns: 208px minmax(0,1fr) minmax(0,1fr);
    gap: 12px; align-items: stretch; height: 400px; margin-bottom: 8px;
  }
  @media (max-width: 1320px) {
    .lab { grid-template-columns: 190px minmax(0,1fr); height: auto; }
    .lab-preview { grid-column: 2; }
  }
  @media (max-width: 900px) {
    .lab { grid-template-columns: 1fr; }
    .lab-preview { grid-column: 1; }
    .lab-tabs { flex-direction: row !important; flex-wrap: wrap; }
  }

  .lab-tabs { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .lab-tab {
    text-align: left; padding: 9px 12px; border-radius: 9px; cursor: pointer;
    background: var(--panel); border: 1px solid var(--line); color: var(--dim);
    font-family: var(--sans); font-size: 12.5px; line-height: 1.35; transition: all .13s;
  }
  .lab-tab:hover { color: var(--ink); border-color: var(--line-2); background: var(--panel-2); }
  .lab-tab.on { color: var(--cyan); border-color: rgba(78,226,245,.45); background: rgba(78,226,245,.08); }
  .lab-tab .n { font-family: var(--mono); font-size: 10px; color: var(--dimmer); display: block; margin-bottom: 2px; }
  .lab-tab.on .n { color: rgba(78,226,245,.65); }
  .lab-say { font-size: 12px; color: var(--dimmer); padding: 4px 4px 0; line-height: 1.5; }

  .lab-editor, .lab-preview {
    background: var(--panel); border: 1px solid var(--line); border-radius: 11px;
    overflow: hidden; display: flex; flex-direction: column; min-width: 0; min-height: 280px;
  }
  .lab-editor .tip { color: var(--dimmer); text-transform: none; letter-spacing: 0; font-size: 11px; }
  .fig {
    font-family: var(--mono); font-size: 10.5px; letter-spacing: .06em;
    color: var(--violet); background: rgba(169,139,255,.12);
    border: 1px solid rgba(169,139,255,.3); border-radius: 5px; padding: 1px 6px;
    text-transform: none; white-space: nowrap; user-select: all;
  }
  .lab-tab .fig { display: inline-block; margin-bottom: 3px; }
  .lab-tab.on .fig { color: var(--cyan); background: rgba(78,226,245,.13); border-color: rgba(78,226,245,.35); }
  .reset {
    font-family: var(--sans); font-size: 11px; letter-spacing: 0; text-transform: none;
    padding: 3px 9px; border-radius: 6px; cursor: pointer;
    background: var(--panel); border: 1px solid var(--line-2); color: var(--dim);
    transition: all .13s; white-space: nowrap;
  }
  .reset:hover { color: var(--cyan); border-color: rgba(78,226,245,.45); background: rgba(78,226,245,.08); }
  .reset.dirty { color: var(--amber); border-color: rgba(255,200,97,.45); background: rgba(255,200,97,.09); }
  .lab-head-right { display: flex; align-items: center; gap: 9px; }

  /* Highlighted textarea: a transparent input sits exactly on top of a
     highlighted <pre>. Both must share every metric or the caret drifts —
     same font, same padding, same wrapping, and no extra element between the
     <pre> and its text (a nested <code> was the scroll container's undoing). */
  .ed { position: relative; flex: 1; min-height: 0; }
  .ed-hl, .ed-in {
    position: absolute; inset: 0; margin: 0; border: 0;
    padding: var(--code-pad); font-family: var(--mono); font-size: var(--code-size);
    line-height: var(--code-lh); white-space: pre; overflow-wrap: normal;
    word-break: normal; tab-size: 2; letter-spacing: normal;
  }
  .ed-hl { overflow: hidden; pointer-events: none; color: var(--ink); }
  .ed-in {
    width: 100%; height: 100%; resize: none; outline: none; overflow: auto;
    background: transparent; color: transparent; caret-color: var(--cyan);
  }
  .ed-in::-webkit-scrollbar { width: 9px; height: 9px; }
  .ed-in::selection { background: rgba(78,226,245,.28); }
  .ed-in::-webkit-scrollbar-thumb { background: #1e2a3a; border-radius: 4px; }

  .stats { display: flex; align-items: center; gap: 9px; font-family: var(--mono); letter-spacing: 0; text-transform: none; font-size: 11px; }
  .stats .live { display: flex; align-items: center; gap: 5px; color: var(--green); }
  .stats .live i { width: 6px; height: 6px; border-radius: 50%; background: var(--green); animation: pulse 1.8s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .25; } }
  .stats .stat { color: var(--dimmer); }
  .stats .stat b { color: var(--cyan); font-weight: 700; }
  .stats .stat.ops b { color: var(--amber); }

  .lab-preview iframe { flex: 1; width: 100%; border: 0; display: block; background: #fff; min-height: 200px; }
  .err {
    display: none; padding: 8px 12px; font-family: var(--mono); font-size: 11.5px;
    color: #ffd0d0; background: rgba(255,122,122,.13);
    border-bottom: 1px solid rgba(255,122,122,.35); white-space: pre-wrap; max-height: 90px; overflow: auto;
  }
  .err.on { display: block; }

  /* -------------------------------------------------------------- footer */
  #foot { flex: 0 0 auto; display: flex; align-items: center; justify-content: space-between; padding: 11px 44px; border-top: 1px solid var(--line); background: var(--bg-2); }
  .nav-btn { display: flex; align-items: center; gap: 7px; padding: 7px 15px; border-radius: 8px; background: var(--panel); border: 1px solid var(--line-2); color: var(--dim); font-family: var(--sans); font-size: 13px; cursor: pointer; transition: all .13s; }
  .nav-btn:hover:not(:disabled) { color: var(--cyan); border-color: rgba(78,226,245,.45); background: rgba(78,226,245,.07); }
  .nav-btn[hidden] { display: none; }
  #foot { min-height: 52px; }
  .counter { font-family: var(--mono); font-size: 12px; color: var(--dimmer); }
  .counter b { color: var(--ink); }
  kbd { font-family: var(--mono); font-size: 10.5px; padding: 1.5px 5px; border-radius: 4px; background: #131c28; border: 1px solid var(--line-2); color: var(--dim); }

  /* -------------------------------------------------------------- intro */
  .lede { font-size: 17px; color: var(--dim); max-width: 90ch; margin-bottom: 22px; }
  .arch { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(300px,100%), 1fr)); gap: 14px; margin-bottom: 20px; }
  .arch .card { background: var(--panel); border: 1px solid var(--line); border-radius: 11px; padding: 16px 18px; }
  .arch .card h3 { font-family: var(--mono); font-size: 14px; margin-bottom: 4px; }
  .arch .card .era { font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--dimmer); margin-bottom: 10px; }
  .arch .card p { font-size: 13.5px; color: var(--dim); margin-bottom: 10px; }
  .arch .card .flow { font-family: var(--mono); font-size: 11.5px; color: var(--cyan); line-height: 1.9; }
  .arch .a3 { border-color: rgba(78,226,245,.3); }

  table.mx { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.mx th, table.mx td { text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
  table.mx th { font-size: 10.5px; letter-spacing: .11em; text-transform: uppercase; color: var(--dimmer); font-weight: 650; }
  table.mx td:first-child { font-family: var(--mono); color: var(--cyan); white-space: nowrap; }
  table.mx tr:last-child td { border-bottom: 0; }
  .legend { display: flex; gap: 18px; flex-wrap: wrap; font-size: 12.5px; color: var(--dim); margin-top: 6px; }
  .legend span { display: flex; align-items: center; gap: 7px; }

  /* -------------------------------------------------------------- home */
  .hero { padding: 6px 0 30px; }
  .hero-title {
    font-size: clamp(34px, 4.6vw, 54px); font-weight: 800; line-height: 1.08;
    letter-spacing: -.025em; margin: 10px 0 16px; color: #fff;
  }
  .hero-title .grad {
    background: linear-gradient(100deg, #67e8f9 0%, #7dd3fc 42%, var(--pink) 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .hero-sub { font-size: 17px; color: var(--dim); max-width: 74ch; line-height: 1.6; }
  .hero-sub code, .sec-sub code { color: var(--pink); font-family: var(--mono); font-size: .9em; }
  .hero-cta { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 20px; }
  .btn {
    display: inline-flex; align-items: center; gap: 7px; padding: 9px 17px; border-radius: 9px;
    background: var(--panel); border: 1px solid var(--line-2); color: var(--dim);
    font-size: 13.5px; text-decoration: none; transition: all .13s; cursor: pointer;
    font-family: var(--sans);
  }
  .btn:hover { color: var(--cyan); border-color: rgba(78,226,245,.45); background: rgba(78,226,245,.08); }
  .btn.primary { color: var(--cyan); border-color: rgba(78,226,245,.4); background: rgba(78,226,245,.1); }
  .btn.primary:hover { background: rgba(78,226,245,.18); }
  .btn.sm { padding: 5px 12px; font-size: 12px; }
  .btn.ok { color: var(--green); border-color: rgba(92,230,168,.45); background: rgba(92,230,168,.1); }

  .drop { margin: 24px 0 18px; }
  .drop h2 { font-size: 20px; color: var(--cyan); margin-bottom: 6px; }
  .drop p { color: var(--dim); font-size: 13.5px; margin-bottom: 11px; }
  .cdn-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .cdn {
    font-family: var(--mono); font-size: 12.5px; color: var(--green);
    background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
    padding: 8px 12px; user-select: all; overflow-x: auto; white-space: nowrap;
  }
  h3.sec { font-size: 18px; color: var(--ink); margin: 26px 0 6px; }
  p.sec-sub { color: var(--dim); font-size: 13.5px; max-width: 95ch; margin-bottom: 14px; }
  .xlink { color: var(--cyan); text-decoration: none; border-bottom: 1px dotted rgba(78,226,245,.5); }
  .xlink:hover { border-bottom-style: solid; }
  .callout a.xlink { color: var(--cyan); }

  /* --------------------------------------------------------------- chrome */
  /* In normal flow at the top of the scroll container, so it scrolls away
     like any other content rather than hovering over the page. */
  #topbar {
    display: flex; align-items: center; justify-content: flex-end; gap: 10px;
    padding: 10px 0 0; max-width: 1560px; margin: 0 auto;
  }
  #topbar a {
    display: inline-flex; align-items: center; gap: 6px; color: var(--dimmer);
    font-size: 12.5px; text-decoration: none; padding: 5px 10px; border-radius: 7px;
    border: 1px solid transparent; transition: all .13s;
  }
  #topbar a:hover { color: var(--cyan); border-color: var(--line-2); background: var(--panel); }
  #topbar svg { width: 15px; height: 15px; fill: currentColor; }

  .nav-sec {
    padding: 20px 20px 2px; font-size: 10px; letter-spacing: .16em; text-transform: uppercase;
    color: var(--cyan); font-weight: 700; opacity: .8;
    border-top: 1px solid var(--line); margin-top: 12px;
  }
  .group-label { display: flex; align-items: center; gap: 6px; cursor: pointer; user-select: none; }
  .group-label:hover { color: var(--dim); }
  .group-label .caret { transition: transform .14s; display: inline-block; font-size: 8px; }
  .group-label.closed .caret { transform: rotate(-90deg); }
  .nav-group.hidden { display: none; }
  .nav-item .ext { margin-left: auto; color: var(--dimmer); font-size: 10px; }

  @media (max-width: 1020px) {
    #shell { grid-template-columns: 1fr; grid-template-rows: auto minmax(0, 1fr); }
    #rail { border-right: 0; border-bottom: 1px solid var(--line); padding: 8px 0 0; overflow: hidden; display: flex; flex-direction: column; }
    #rail nav { display: flex; flex-wrap: nowrap; overflow-x: auto; overflow-y: hidden; gap: 3px; padding: 0 12px 8px; align-items: center; }
    #rail nav::-webkit-scrollbar { height: 5px; }
    #rail nav::-webkit-scrollbar-thumb { background: #1b2634; border-radius: 3px; }
    /* Horizontal rail: nothing to collapse, so the toggle steps aside. */
    #rail, #shell.railclosed #rail { width: auto; }

<script>
// ---------------------------------------------------------------------------
// Syntax highlighting
// ---------------------------------------------------------------------------
const esc = (s) => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

// Stashing keeps already-decorated fragments out of later passes. Placeholders
// are single private-use codepoints: not word chars, not digits, so no later
// regex can match inside one.
function stasher() {
  const box = [];
  return {
    put: (html) => String.fromCharCode(0xe000 + box.push(html) - 1),
    pop: (s) => s.replace(/[\uE000-\uEFFF]/g, (c) => box[c.charCodeAt(0) - 0xe000]),
  };
}

function hlHtml(src) {
  const st = stasher();
  let s = esc(src);
  s = s.replace(/&lt;!--[\s\S]*?--&gt;/g, (m) => st.put(`<span class="t-cmt">${m}</span>`));
  s = s.replace(/([\w@:.\-$\[\]]+)(=)("|')((?:(?!\3)[\s\S])*)\3/g, (m, name, eq, q, val) => {
    const cls = /^(x-|m-|@|:)/.test(name) ? 't-dir' : 't-attr';
    return st.put(`<span class="${cls}">${name}</span><span class="t-punct">=</span>` +
      `<span class="t-str">${q}${val}${q}</span>`);
  });
  s = s.replace(/(\s)(x-[\w:.\-]+|@[\w.\-]+)(?=[\s/&])/g,
    (m, sp, name) => sp + st.put(`<span class="t-dir">${name}</span>`));
  s = s.replace(/(&lt;\/?)([\w-]+)/g,
    (m, br, tag) => st.put(`<span class="t-punct">${br}</span><span class="t-tag">${tag}</span>`));
  s = s.replace(/\/?&gt;/g, (m) => st.put(`<span class="t-punct">${m}</span>`));
  s = s.replace(/\$(?:store|el|refs|dispatch|watch|nextTick|event|index)\b/g,
    (m) => st.put(`<span class="t-magic">${m}</span>`));
  return st.pop(s);
}

function hlJs(src) {
  const st = stasher();
  let s = esc(src);
  s = s.replace(/\/\/[^\n]*/g, (m) => st.put(`<span class="t-cmt">${m}</span>`));
  s = s.replace(/(['"`])(?:\\.|(?!\1)[\s\S])*?\1/g, (m) => st.put(`<span class="t-str">${m}</span>`));
  s = s.replace(/\$(?:store|el|refs|dispatch|watch|nextTick|event|index)\b/g,
    (m) => st.put(`<span class="t-magic">${m}</span>`));
  s = s.replace(/\b(const|let|var|function|return|if|else|for|of|in|new|class|extends|async|await|import|from|export|default|this|null|true|false|typeof|delete|get|set)\b/g,
    (m) => st.put(`<span class="t-kw">${m}</span>`));
  s = s.replace(/\b\d+(?:\.\d+)?\b/g, (m) => st.put(`<span class="t-num">${m}</span>`));
  s = s.replace(/\b[A-Za-z_$][\w$]*(?=\()/g, (m) => st.put(`<span class="t-fn">${m}</span>`));
  return st.pop(s);
}

const hl = (src, lang) => (lang === 'js' ? hlJs : hlHtml)(src);
const code = (src, lang) => `<pre class="code"><code>${hl(String(src).trim(), lang || 'html')}</code></pre>`;

// ---------------------------------------------------------------------------
// Preview document — real m.js, an error bridge, and a live render-cost meter
// ---------------------------------------------------------------------------
const RUNTIME = document.getElementById('mjs-runtime').textContent;

const PREVIEW_CSS = `
  body{font:14px/1.5 system-ui,sans-serif;color:#16202c;padding:14px;margin:0;background:#fff}
  button{font:inherit;padding:5px 11px;border-radius:7px;border:1px solid #c3ceda;background:#f2f6fa;cursor:pointer}
  button:hover{background:#e6eef6} button:disabled{opacity:.45;cursor:not-allowed}
  input,select,textarea{font:inherit;padding:5px 8px;border:1px solid #c3ceda;border-radius:6px}
  ul,ol{margin:8px 0;padding-left:20px}li{margin:3px 0}
  .box{border:1px solid #dbe3ec;border-radius:8px;padding:9px;margin-top:8px;background:#f8fbfd}
  .tag{display:inline-block;padding:2px 8px;border-radius:99px;background:#e3f2fb;font-size:12px}
  .on{background:#d6f5e3}.hot{color:#c2410c;font-weight:600}
  code{font-family:ui-monospace,Menlo,monospace;background:#eef3f8;padding:1px 5px;border-radius:4px;font-size:12.5px}
  h4{margin:6px 0 2px;font-size:13px}
`;

// Classic script so it is installed before the module runs and can catch
// module parse errors too.
const ERROR_BRIDGE = `<script>
(function () {
  function report(msg) {
    try { parent.postMessage({ source: 'm-doc', type: 'error', message: String(msg) }, '*'); } catch (_) {}
  }
  addEventListener('error', function (e) {
    report(e.message || (e.error && e.error.message) || 'Script error');
  });
  addEventListener('unhandledrejection', function (e) {
    var r = e.reason; report(r && r.message ? r.message : r || 'Unhandled rejection');
  });
})();
<\/script>`;

// Reports how much work the runtime actually did. `redraws` is M.refreshCount;
// `ops` counts DOM mutations — the number that makes the idempotent-redraw
// claim visible. Both are zeroed after the initial mount, so they measure the
// cost of *your interactions*, not of booting.
const STATS_PROBE = `
  let __base = 0, __ops = 0;
  const __M = () => window.M;
  const __post = () => {
    if (!__M()) return;
    try { parent.postMessage({ source: 'm-doc', type: 'stats', run: __RUN__,
      redraws: Math.max(0, __M().refreshCount - __base), ops: __ops }, '*'); } catch (_) {}
  };
  const __mo = new MutationObserver((recs) => { __ops += recs.length; __post(); });
  // Wait for the runtime: a full-document example imports it over the network.
  const __arm = (tries) => {
    if (!__M()) return tries > 0 ? setTimeout(() => __arm(tries - 1), 60) : undefined;
    __base = __M().refreshCount; __ops = 0;
    __mo.observe(document.body, { childList: true, attributes: true, characterData: true, subtree: true });
    __post();
  };
  requestAnimationFrame(() => requestAnimationFrame(() => __arm(60)));
  setInterval(__post, 300);
`;

/**
 * Build a runnable preview from editor source. Any <script> blocks are lifted
 * out and run after the runtime, so examples can call M.data / M.store before
 * the tree is mounted.
 */
let runToken = 0;

function demoDoc(src) {
  const token = ++runToken;
  const raw = String(src).trim();
  const probe = `<script type="module">${STATS_PROBE.replace('__RUN__', token)}<\/script>`;

  // A complete document is passed through and really runs — that is the point
  // of the CDN drop-in example: what you read is what executes.
  if (/^<!DOCTYPE/i.test(raw) || /^<html[\s>]/i.test(raw)) {
    let html = raw;
    const head = `${ERROR_BRIDGE}<style>${PREVIEW_CSS}</style>`;
    if (/<head[^>]*>/i.test(html)) html = html.replace(/<head[^>]*>/i, (m) => m + head);
    else if (/<html[^>]*>/i.test(html)) html = html.replace(/<html[^>]*>/i, (m) => `${m}<head>${head}</head>`);
    else html = head + html;
    return html.replace(/<\/body>/i, probe + '</body>');
  }

  // Fragments get the bundled runtime, so the directive is what is being shown
  // rather than the network. Any <script> runs after it, before M.start().
  const setup = [];
  const markup = raw
    .replace(/<script\b[^>]*>([\s\S]*?)<\/script>/gi, (m, body) => { setup.push(body); return ''; })
    .trim();
  return `<!DOCTYPE html><html><head><meta charset="utf-8">
${ERROR_BRIDGE}
<style>${PREVIEW_CSS}</style></head><body>
${markup}
<script type="module">
${RUNTIME}
try {
${setup.join('\n')}
// An example that mounted its own root must not also be scanned by start() —
// that would rebuild the rendered markup as a second tree and drop every
// listener the first one installed.
if (!M.root) M.start();
} catch (e) {
  parent.postMessage({ source: 'm-doc', type: 'error', run: ${token}, message: String((e && e.message) || e) }, '*');
}
<\/script>
${probe}
</body></html>`;
}

// Content
// ---------------------------------------------------------------------------
const S = { parity: 'Full parity', extended: 'Beyond Alpine', tradeoff: 'Trade-off', partial: 'Partial', missing: 'Not implemented' };

const ITEMS = [

  <h3 class="sec">Adding HMR to a server you already have</h3>
  <p class="sec-sub">m.js's hot-reload client is not tied to the bundled dev server. It speaks a two-message

import { WebSocketServer } from 'ws'
import chokidar from 'chokidar'
import path from 'node:path'

const ROOT = 'public'
const app = express()
app.use(express.static(ROOT))
const server = app.listen(3000)

// 1. the socket the client connects to — the path matters
const wss = new WebSocketServer({ server, path: '/__m_hmr' })
wss.on('connection', (ws) => ws.send(JSON.stringify({ type: 'connected' })))

// 2. tell every client which file changed
chokidar.watch(ROOT, { ignoreInitial: true }).on('all', (event, file) => {
  if (event !== 'change' && event !== 'add') return
  const rel = '/' + path.relative(ROOT, file).split(path.sep).join('/')
  const msg = JSON.stringify({ type: 'change', path: rel })
  for (const ws of wss.clients) if (ws.readyState === 1) ws.send(msg)
})`, 'js')}

export async function boot() {

        <tr><td>:class</td><td>effect mutates classList</td><td>attribute in the VNode bag</td></tr>
        <tr><td>x-for</td><td>effect manages child list</td><td>keyed fragment + LIS reorder</td></tr>
        <tr><td>@click</td><td>listener added once</td><td>attr with a stable identity key</td></tr>
        <tr><td>redraw cost</td><td>n/a (no redraw)</td><td>O(tree) diff, 0 DOM writes if equal</td></tr>
      </table></div>
    </div>
    <div class="panel">
      <header><span class="who"><span class="tick" style="background:var(--amber)"></span>Legend</span></header>
      <div style="padding:14px 16px">

          <span><span class="dot parity"></span><b style="color:var(--green)">Full parity</b> — same syntax, same semantics</span>

          <span><span class="dot tradeoff"></span><b style="color:var(--amber)">Trade-off</b> — works, but differs somewhere you should know</span>
          <span><span class="dot partial"></span><b style="color:var(--violet)">Partial</b> — a subset of Alpine's surface</span>
          <span><span class="dot missing"></span><b style="color:var(--red)">Not implemented</b> — deliberately left out</span>
        </div>

        example on the left, <strong style="color:var(--ink)">edit the code</strong>, and the preview re-runs as
        you type. Syntax and runtime errors surface in a red bar above it.</p>

{
  id: 'x-data', kind: 'attribute', group: 'Attributes', sec: 'API reference', status: 'parity', name: 'x-data',
  tagline: 'Declare a component and the state that belongs to a block of HTML.',
  alpine: `<div x-data="{ open: false }">
  <button @click="open = !open">Toggle</button>
  <p x-show="open">Now you see me</p>
</div>`,
  v2: `class Dropdown extends Component {
  oninit() { this.state = { open: false } }
  view() {
    return M.html('div', null,
      M.html('button', { onclick: () => {
        this.state.open = !this.state.open
        M.redraw()          // no reactivity — you drive it
      }}, M.text('Toggle')),
      this.state.open && M.html('p', null, M.text('Now you see me')))
  }
}`,
  v2note: 'v2 had no markup-level scope. State was a plain object on a Component instance and every change needed an explicit redraw.',
  v3: `<div x-data="{ open: false }">
  <button @click="open = !open">Toggle</button>
  <p x-show="open">Now you see me</p>
</div>`,
  v3note: 'Byte-identical to Alpine.',
  notes: { kind: 'info', title: 'How it works now', items: [
    '<code>x-data</code> compiles to a <code>ComponentVNode</code>. Its scope lives on the component <em>instance</em>, and the diff carries that instance across redraws via <code>_update</code> — the same mechanism v2 used to preserve component state.',
    'Nested <code>x-data</code> inherits from the parent\'s <strong>raw</strong> target, not the parent proxy. A proxy on the prototype chain would capture plain assignments to the child through its own <code>set</code> trap.',
    '<code>init()</code> and <code>destroy()</code> methods on the scope object are honoured.'
  ]},
  why: 'This is the unit of encapsulation. Everything inside the element can read and write that object by bare name — no imports, no wiring, no build step. It is the single reason Alpine-style markup feels lighter than a component framework.',
  examples: [
    { lbl: 'Local state that survives redraws', say: 'Click a few times. The counter keeps rising and DOM ops stay tiny — the node is patched, never rebuilt.', src:
`<div x-data="{ open: false, n: 0 }">
  <button @click="open = !open; n++">Toggle</button>
  <span class="tag" x-text="'toggled ' + n + '×'"></span>
  <div class="box" x-show="open">
    Panel content. Try editing this text.
  </div>
</div>` },
    { lbl: 'Tabs — one string drives three views', say: 'A single value in state decides which panel is visible.', src:
`<div x-data="{ tab: 'billing' }">
  <button @click="tab = 'billing'" :class="tab === 'billing' && 'on'">Billing</button>
  <button @click="tab = 'team'" :class="tab === 'team' && 'on'">Team</button>
  <button @click="tab = 'api'" :class="tab === 'api' && 'on'">API</button>

  <div class="box" x-show="tab === 'billing'">Card ending 4242</div>
  <div class="box" x-show="tab === 'team'">3 seats used of 5</div>
  <div class="box" x-show="tab === 'api'">Key: sk_live_…</div>
</div>` },
    { lbl: 'Methods live on the same object', say: '`this` inside a method is the reactive scope, so `this.x = …` is tracked.', src:
`<div x-data="{
  email: '',
  sending: false,
  sent: false,
  submit() {
    this.sending = true
    setTimeout(() => { this.sending = false; this.sent = true }, 700)
  }
}">
  <input x-model="email" placeholder="you@example.com">
  <button @click="submit()" :disabled="sending || !email">
    <span x-text="sending ? 'Sending…' : 'Sign up'"></span>
  </button>
  <div class="box on" x-show="sent">Signed up as <b x-text="email"></b></div>
</div>` }
  ]
},

{
  id: 'x-bind', kind: 'attribute', group: 'Attributes', sec: 'API reference', status: 'partial', name: 'x-bind',
  tagline: 'Set any HTML attribute from an expression. Shorthand: <code>:attr</code>.',
  alpine: `<div x-bind:class="!open ? 'hidden' : ''">…</div>
<button :disabled="busy">Save</button>
<a :href="'/user/' + id">Profile</a>

<!-- spread form: an object of attributes -->
<div x-bind="attrs"></div>`,
  v2: `M.html('div', { class: open ? '' : 'hidden' })
M.html('button', { disabled: busy }, M.text('Save'))
M.html('a', { href: '/user/' + id }, M.text('Profile'))`,
  v2note: 'Attributes were a plain object literal — the closest thing v2 had to a binding.',
  v3: `<div :class="!open ? 'hidden' : ''">…</div>
<button :disabled="busy">Save</button>
<a :href="'/user/' + id">Profile</a>

<!-- NOT supported: the object spread form -->
<div x-bind="attrs"></div>`,
  v3note: 'Per-attribute binding is identical. The spread form is not implemented.',
  notes: { kind: 'warn', title: 'Differences worth knowing', items: [
    '<strong><code>x-bind="objectOfAttrs"</code> is not implemented.</strong> m.js treats the argument-less form as <code>:value</code>. Bind attributes one at a time.',
    '<code>:class</code> and <code>:style</code> are <strong>additive</strong> — the computed value merges with the static <code>class</code>/<code>style</code> instead of replacing it. String, array and object forms all work.',
    'Boolean attributes render as <code>name="name"</code> when truthy and are removed when falsy.',
    '<code>value</code>, <code>checked</code> and <code>selected</code> are written as DOM <em>properties</em> — an attribute write does not move a control the user has already touched.',
    'Removal is driven by <code>null</code>/<code>undefined</code>/<code>false</code>. An empty string is a real value, so <code>:alt="\'\'"</code> keeps the attribute.'
  ]},
  why: 'Binding is what turns static markup into a view. Nearly every real interaction is "flip a class", "disable a button while a request is in flight", or "build a URL from an id" — each one attribute away from being declarative.',
  examples: [
    { lbl: 'Classes and boolean attributes', say: 'The button disables itself at zero. Nothing imperative anywhere.', src:
`<div x-data="{ hot: false, n: 3 }">
  <button @click="hot = !hot">Toggle class</button>
  <button @click="n--" :disabled="n <= 0">Decrement</button>
  <button @click="n = 3">Reset</button>
  <div class="box" :class="{ hot: hot }">
    <code>n</code> = <b x-text="n"></b>
  </div>
</div>` },
    { lbl: 'Object, array and string class forms', say: 'All three merge with the static class already on the element.', src:
`<div x-data="{ a: true, b: false, extra: 'tag' }">
  <button @click="a = !a">a</button>
  <button @click="b = !b">b</button>

  <div class="box" :class="{ on: a, hot: b }">object form</div>
  <div class="box" :class="[a && 'on', b && 'hot']">array form</div>
  <div class="box" :class="extra">string form — merges with class="box"</div>
</div>` },
    { lbl: 'Derived href, title and style', say: 'Three attributes computed from one piece of state.', src:
`<div x-data="{ id: 7, pct: 40 }">
  <button @click="id++">next user</button>
  <button @click="pct = Math.min(100, pct + 20)">+20%</button>
  <button @click="pct = 0">reset</button>

  <div class="box">
    <a :href="'/user/' + id" :title="'Open user ' + id"
       x-text="'/user/' + id"></a>
  </div>

  ]

{

{
  id: 'x-html', kind: 'attribute', group: 'Attributes', sec: 'API reference', status: 'tradeoff', name: 'x-html',

     x-init="fetch('/partial').then(r => r.text())

    'The element becomes a <code>RawHTMLVNode</code>: the diff <strong>never descends into it</strong>, and <code>innerHTML</code> is only rewritten when the string changes.',
    'Directives inside the injected HTML are <strong>not</strong> processed — inert content, same as Alpine.',

  <div class="box"><b>x-text:</b> <span x-text="raw"></span></div>

{

  alpine: `<div x-show="open" x-transition>…</div>

<!-- full staged API -->
<div x-show="open"
  x-transition:enter="transition ease-out duration-300"
  x-transition:enter-start="opacity-0 scale-90"
  x-transition:enter-end="opacity-100 scale-100"
  x-transition:leave="transition ease-in duration-200"
  x-transition:leave-start="opacity-100"
  x-transition:leave-end="opacity-0">…</div>

<template x-if="open"><div x-transition>…</div></template>`,
  v2: `// not supported`,
  v2note: 'v2 had no transition concept. `_delete` removed nodes synchronously.',
  v3: `<!-- supported: x-show only -->
<div x-show="open" x-transition>…</div>
<div x-show="open" x-transition.duration.500ms>…</div>

<!-- NOT supported -->
<div x-transition:enter="…" x-transition:leave="…">
<template x-if="open"><div x-transition>…</div></template>`,
  v3note: 'A declarative opacity + visibility fade on x-show. Everything else is out.',
  notes: { kind: 'gone', title: 'Deliberately left out — and why', items: [
    '<strong>x-if leave transitions are not implemented.</strong> A leave transition needs the node to stay in the DOM <em>after</em> it is logically gone. v2\'s <code>_delete</code> removes synchronously and <code>onbeforeremove()</code> is a no-op stub. Supporting it means teaching the diff deferred removal: <code>_delete</code> returning a promise, the delete pass holding the node, and a "leaving" mark so an intervening redraw neither re-diffs nor re-inserts it. Genuine new design, not a port — so it was scoped out rather than half-built.',
    '<strong>The staged class API</strong> is not implemented. It needs imperative multi-frame choreography (set class, force reflow, set next class) which cannot be expressed as a single declarative render.',
    '<strong>What works:</strong> <code>x-show</code> + <code>x-transition</code> hides with <code>opacity:0; visibility:hidden</code> and a delayed visibility transition, because <code>display</code> cannot be transitioned. <code>.duration.&lt;ms&gt;</code> is honoured; default 150&nbsp;ms.'
  ]},
  why: 'Motion communicates causality — a panel that fades in reads as "this appeared because you clicked", where an instant swap reads as a glitch. The x-show case covers most of that.',
  examples: [
    { lbl: 'Fade, with duration', say: 'Edit the duration modifier and watch it change. Try removing x-transition entirely.', src:
`<div x-data="{ a: true, b: true }">
  <button @click="a = !a">fast (150ms default)</button>
  <button @click="b = !b">slow (900ms)</button>
  <div class="box" x-show="a" x-transition>default fade</div>
  <div class="box on" x-show="b" x-transition.duration.900ms>slow fade</div>
</div>` },
    { lbl: 'The workaround for the x-if case', say: 'Keep it mounted and animate a bound class. Costs a little memory, gets you the motion.', src:
`<div x-data="{ open: false }">
  <style>
    .slide { transition: transform .35s ease, opacity .35s ease;
             transform: translateY(-8px); opacity: 0 }
    .slide.in { transform: none; opacity: 1 }
  </style>
  <button @click="open = !open">Slide in</button>
  <div class="box slide" :class="{ in: open }">
    Animated via a bound class, not x-transition.
  </div>
</div>` }
  ]
},

{
  id: 'x-for', kind: 'attribute', group: 'Attributes', sec: 'API reference', status: 'extended', name: 'x-for',
  tagline: 'Repeat a block of HTML for each item in a collection.',
  alpine: `<template x-for="post in posts" :key="post.id">
  <h2 x-text="post.title"></h2>
</template>`,
  v2: `M.volatile({
  [post.id]: M.html('h2', null, M.text(post.title)),
  // …one entry per row, keyed
})`,
  v2note: 'The ancestor of the whole feature. v2\'s keyed sibling map plus LIS reorder is what x-for compiles to in v3 — the same code, reached from markup instead of hyperscript.',
  v3: `<!-- on a template, like Alpine -->
<template x-for="post in posts" :key="post.id">
  <h2 x-text="post.title"></h2>
</template>

<!-- or directly on the repeated element -->
<li class="row" x-for="post in posts" :key="post.id"
    x-text="post.title"></li>

<!-- objects, ranges, any iterable -->
<div x-for="(value, key) in settings"></div>
<div x-for="i in 5"></div>`,
  v3note: 'Alpine syntax, plus a bare-element form and a wider range of iterables.',
  notes: { kind: 'info', title: 'The centrepiece of the port', items: [
    'Each row becomes a keyed sibling in a <code>volatile()</code> fragment. The diff computes a <strong>longest increasing subsequence</strong> over the old→new index map, so a maximal stable run of rows never moves — reversing 20 items performs 19 moves, not 40 create/destroys.',
    'Row identity is real: reorder a list and the DOM nodes are the <em>same objects</em>, carrying scroll, focus and input state with them.',
    'Iterables: arrays, plain objects (<code>(value, key) in obj</code>), integers (<code>i in 5</code>), anything with <code>Symbol.iterator</code>. <code>$index</code> is always available.',
    'The row scope is a <strong>delegating Proxy</strong>, not a prototype chain: locals shadow the parent, everything else forwards to the parent proxy. An inherited method called from a row is already bound to the store, so <code>this.items = …</code> mutates the store — while writing a local cannot leak upward.',
    'Duplicate keys are disambiguated and warned about rather than silently collapsing rows.'
  ]},
  why: 'Lists are where naive rendering falls apart. Without keyed reconciliation, editing one row of a table rebuilds every row — losing focus, scroll and selection, and burning frames. This is the single most valuable thing the virtual DOM buys you.',
  examples: [
    { lbl: 'Reorder keeps node identity', say: 'Type into a box, then Reorder — your text travels with its row, and DOM ops stay far below a rebuild. Add and delete rows too; <code>rotate()</code> works for any length.', src:
`<div x-data="{
  items: [{id:1,t:'alpha'},{id:2,t:'beta'},{id:3,t:'gamma'}],
  rotate() { this.items = [...this.items.slice(-1), ...this.items.slice(0, -1)] },
  drop(id) { this.items = this.items.filter(i => i.id !== id) },
  add() { const n = Date.now() % 1000
          this.items.push({ id: n, t: 'new ' + n }) }
}">
  <button @click="rotate()">Reorder</button>
  <button @click="add()">Add</button>
  <ul>
    <li x-for="it in items" :key="it.id">
      <b x-text="it.t"></b>
      <input placeholder="type here…" style="width:110px">
      <button @click="drop(it.id)">×</button>
    </li>
  </ul>
</div>` },
    { lbl: 'Keyed vs unkeyed', say: 'Type into both lists, then Reorder. The keyed inputs follow their row; the unkeyed ones stay put.', src:
`<div x-data="{
  items: [{id:1,t:'alpha'},{id:2,t:'beta'},{id:3,t:'gamma'}],
  rotate() { this.items = [...this.items.slice(-1), ...this.items.slice(0, -1)] }
}">
  <button @click="rotate()">Reorder</button>
  <p><b>Keyed</b> — :key="it.id"</p>
  <ul><li x-for="it in items" :key="it.id">
    <b x-text="it.t"></b> <input style="width:90px">
  </li></ul>
  <p><b>Unkeyed</b> — falls back to index</p>
  <ul><li x-for="it in items">
    <b x-text="it.t"></b> <input style="width:90px">
  </li></ul>
</div>` },
    { lbl: 'Objects, ranges and $index', say: 'One directive covers ordered lists, key/value dumps and plain counting.', src:
`<div x-data="{
  list: ['red','green','blue'],
  meta: { region: 'eu-west', tier: 'pro' },
  n: 4
}">
  <button @click="n = n % 8 + 1">range = <b x-text="n"></b></button>
  <div class="box">
    <div x-for="(c, i) in list" x-text="(i + 1) + '. ' + c"></div>
  </div>
  <div class="box">
    <div x-for="(v, k) in meta"><b x-text="k"></b>: <span x-text="v"></span></div>
  </div>
  <div class="box">
    <span class="tag" x-for="i in n" x-text="i" style="margin-right:4px"></span>
  </div>
</div>` }
  ]
},

{
  id: 'x-if', kind: 'attribute', group: 'Attributes', sec: 'API reference', status: 'extended', name: 'x-if',
  tagline: 'Add or remove a block of HTML from the page entirely.',
  alpine: `<!-- Alpine REQUIRES a template wrapper -->
<template x-if="open">
  <div>…</div>
</template>`,
  v2: `// return a falsy vnode, or use the helper
open && M.html('div', null, …)
M.wrapIf(open, (kids) => M.html('div', null, kids), kids)`,
  v2note: '`_isFalsy` dropping a sibling is still exactly how v3 removes an x-if branch.',
  v3: `<!-- template form works -->
<template x-if="open">
  <div>…</div>
</template>

<!-- and so does the bare element form -->
<div x-if="open">…</div>`,
  v3note: 'Both forms. The bare-element form is not available in Alpine.',
  notes: { kind: 'info', title: 'Why toggling one branch does not disturb its neighbours', items: [
    'Children are keyed by their position in the <strong>AST</strong>, not in the rendered output. An <code>x-if</code> that renders nothing leaves a hole rather than shifting every later sibling\'s key.',
    'Without that, toggling a conditional would renumber its siblings and each would look like a different element at its index. This was a real bug during the port: a <code>&lt;div x-if&gt;</code> appearing in a slot previously held by a <code>&lt;button&gt;</code> was created but never inserted, because the changed node still counted toward the stable subsequence.',
    'The <code>&lt;template&gt;</code> form renders its children with no wrapper element, so you can conditionally emit several siblings at once.'
  ]},
  why: 'For content usually absent — modals, empty states, admin-only controls — keeping it mounted and hidden wastes memory and can leak behaviour (hidden form fields still submit, hidden iframes still load). x-if makes absence real.',
  examples: [
    { lbl: 'Siblings keep their state', say: 'Type in the input, then toggle. The input is untouched — the conditional does not renumber its neighbours.', src:
`<div x-data="{ show: false }">
  <button @click="show = !show">Toggle branch</button>
  <div class="box"><input placeholder="type here first"></div>
  <div x-if="show" class="box on">I was just added to the DOM.</div>
  <div class="box">…and this one never moved.</div>
</div>` },
    { lbl: 'template x-if — several siblings, no wrapper', say: 'No extra div forced into your layout.', src:
`<div x-data="{ admin: false }">
  <label><input type="checkbox" x-model="admin"> admin mode</label>
  <div class="box">
    <button>View</button>
    <template x-if="admin">
      <button>Edit</button>
      <button>Delete</button>
    </template>
  </div>
</div>` }
  ]
},

{
  id: 'x-init', kind: 'attribute', group: 'Attributes', sec: 'API reference', status: 'parity', name: 'x-init',
  tagline: 'Run code once, when the element is first created.',

<div x-data="{ posts: [] }"
     x-init="posts = await (await fetch('/api')).json()">
</div>`,
  v2: `class Widget extends Component {
  oninit()   { /* before first view() */ }
  oncreate() { /* after DOM exists */ }
}`,
  v2note: 'v2 queued `oncreate` into `_delayedLifecycleEvents` and drained it after the diff committed. v3 uses the same queue.',

<!-- no implicit await — use .then or an async IIFE -->
<div x-data="{ posts: [] }"

</div>`,
  v3note: 'Same directive and timing. Alpine\'s implicit await is not available.',
  notes: { kind: 'info', title: 'Timing guarantees', items: [
    'Runs from the <strong>deferred lifecycle queue</strong> — pushed during the diff, drained only after the whole tree is committed. Your code can never observe a half-updated DOM, and calling <code>M.redraw()</code> here cannot re-enter the diff.',

  examples: [

`<div x-data="{ at: '', tag: '', refVal: '' }"
     x-init="at = new Date().toLocaleTimeString();
             tag = $el.tagName;
             refVal = $refs.probe.value">
  <input x-ref="probe" value="read from a ref">
  <div class="box">
    ran at <b x-text="at"></b><br>

  </div>

    { lbl: 'Load data on mount', say: 'A whole data-loading component with no separate JS file.', src:
`<div x-data="{ rows: [], loading: true }"
     x-init="setTimeout(() => {
       rows = [{id:1,n:'ada'},{id:2,n:'grace'},{id:3,n:'linus'}]

{
  id: 'x-effect', kind: 'attribute', group: 'Attributes', sec: 'API reference', status: 'parity', name: 'x-effect',
  tagline: 'Re-run a snippet whenever any state it reads changes.',
  alpine: `<div x-effect="console.log('Count is ' + count)"></div>`,
  v2: `// no equivalent — v2 had no reactivity at all`,
  v2note: 'The one Alpine idea with no v2 ancestor whatsoever.',
  v3: `<div x-effect="console.log('Count is ' + count)"></div>`,
  v3note: 'Identical — and one of the few places the reactive core is still load-bearing.',
  notes: { kind: 'info', title: 'Why the reactive core survived the port', items: [
    'DOM patching no longer goes through effects — that is the diff\'s job. But <code>x-effect</code>, <code>$watch</code> and store subscriptions genuinely need <strong>fine-grained dependency tracking</strong>, so the proxy/track/trigger core stays.',
    'Dependencies are collected on each run, exactly like Alpine: read <code>count</code> and you are subscribed to <code>count</code>.',
    '<strong>Careful:</strong> an effect that writes something it also reads is self-triggering and will loop. Push to a non-reactive sink, or read and write different things. Identical hazard in Alpine.',
    'The effect is torn down when its element is removed, and its captured scope is refreshed on every redraw so it never sees stale state.'
  ]},
  why: 'Side effects that are not rendering: persisting to localStorage, updating document.title, firing analytics, syncing a canvas. Without it you would write `$watch` calls for every dependency by hand.',
  examples: [
    { lbl: 'Runs on mount, then on every change', say: 'Note it fired immediately at mount — that is Alpine behaviour too.', src:
`<div x-data="{ n: 0, last: '—' }"
     x-effect="last = 'effect saw n=' + n + ' at '
               + new Date().toLocaleTimeString()">
  <button @click="n++">Increment</button>
  <div class="box"><b x-text="last"></b></div>
</div>` },
    { lbl: 'Tracks every value it reads', say: 'Change either dropdown. One effect, no dependency list to maintain.', src:
`<div x-data="{ theme: 'dark', density: 'cosy', saved: '' }"
     x-effect="saved = JSON.stringify({ theme, density })">
  <select x-model="theme">
    <option>dark</option><option>light</option>
  </select>
  <select x-model="density">
    <option>cosy</option><option>compact</option>
  </select>
  <div class="box">would persist: <code x-text="saved"></code></div>
</div>` },
    { lbl: 'The self-triggering trap', say: 'Safe as written. Change the effect to <code>x-effect=\"n = n + 0\"</code> \u2014 or make <code>record</code> do <code>this.last += v</code>, which reads what it writes \u2014 and it subscribes to its own output. The run cap stops it and logs to the console.', src:
`<script>
  // runs is a plain closure variable — not reactive, so the effect
  // cannot subscribe to it. That is what makes this safe.
  let runs = 0
  M.data('probe', () => ({
    n: 0,
    last: '\u2014',
    record(v) { runs++; this.last = 'run #' + runs + ' \u2014 saw n=' + v }
  }))
<\/script>

<div x-data="probe" x-effect="record(n)">
  <button @click="n++">increment n</button>
  <div class="box">last: <b x-text="last"></b></div>
  <div class="box">
    The effect READS <code>n</code> and WRITES <code>last</code> \u2014 different
    keys, so it never retriggers itself.
  </div>
</div>` }
  ]
},

{
  id: 'x-ref', kind: 'attribute', group: 'Attributes', sec: 'API reference', status: 'tradeoff', name: 'x-ref',
  tagline: 'Give an element a name so you can reach it via <code>$refs</code>.',
  alpine: `<input type="text" x-ref="content">

<button x-on:click="navigator.clipboard
        .writeText($refs.content.value)">
  Copy
</button>`,
  v2: `// vnode.dom after _create() — you held the VNode
const input = HTMLElementVNode.factory('input', …)
// later: input.dom.value`,
  v2note: 'v2 exposed the real node on the VNode itself. No naming layer was needed because you already had the object.',
  v3: `<input type="text" x-ref="content">

<button @click="navigator.clipboard
        .writeText($refs.content.value)">
  Copy
</button>`,
  v3note: 'Same syntax — but refs register at create time, so they are not available during the first build pass.',
  notes: { kind: 'warn', title: 'The timing trade-off', items: [
    'Refs are populated in the element\'s <strong>create</strong> hook. During the first build pass no DOM exists yet, so <code>$refs</code> is empty in build-time expressions like <code>x-text</code> or <code>:attr</code>.',

    '<strong>Will not work:</strong> <code>&lt;span x-text="$refs.box.value"&gt;</code> on the first render. A consequence of evaluating directives during tree construction rather than against live DOM.',
    'Refs are scoped to the enclosing <code>x-data</code> component, matching Alpine.'
  ]},
  why: 'Sometimes you genuinely need the element — to focus it, measure it, read a file input, or hand it to a library. x-ref gives you that without a querySelector and without a global id.',
  examples: [
    { lbl: 'Read, focus, measure', say: 'All three from a handler, where refs are guaranteed populated.', src:
`<div x-data="{ out: '', size: '' }">
  <input x-ref="box" value="hello refs">
  <button @click="out = $refs.box.value.toUpperCase()">Read</button>

  <button @click="size = Math.round($refs.box.getBoundingClientRect().width) + 'px'">Measure</button>
  <div class="box">
    read: <b x-text="out || '—'"></b><br>
    width: <b x-text="size || '—'"></b>
  </div>
</div>` },
    { lbl: 'The timing caveat, demonstrated', say: 'The x-text version is empty on the first render; the handler version always works. The trade-off in one screen.', src:
`<div x-data="{ pulled: '' }">
  <input x-ref="src" value="I am a ref">
  <div class="box">
    from <code>x-text</code> (build-time):
    <b x-text="$refs.src ? $refs.src.value : '(empty on first pass)'"></b>
  </div>
  <button @click="pulled = $refs.src.value">read from a handler</button>
  <div class="box on">from a handler: <b x-text="pulled || '—'"></b></div>

  ]

{
  id: 'x-ignore', kind: 'attribute', group: 'Attributes', sec: 'API reference', status: 'tradeoff', name: 'x-ignore',
  tagline: 'Tell the framework to leave a subtree alone.',
  alpine: `<div x-ignore>
  …
</div>`,
  v2: `class Embed extends Component {
  onbeforeupdate() { return false }  // freeze the subtree
}`,
  v2note: 'v2 already had the exact mechanism — a component could refuse to update. v3\'s ComponentVNode still honours `onbeforeupdate() === false`.',
  v3: `<div x-ignore>
  …
</div>`,
  v3note: 'Same syntax, but implemented by capturing the markup, not by skipping a walk.',
  notes: { kind: 'warn', title: 'A different mechanism than Alpine\'s', items: [
    'Alpine simply <em>skips</em> the subtree when walking the DOM — whatever is there stays, untouched.',
    'm.js v3 captures the subtree\'s markup at <strong>parse time</strong> and renders it as an opaque <code>RawHTMLVNode</code>. Directives inside are never processed and the diff never descends into it.',
    '<strong>The consequence:</strong> the content is reproduced from the captured string. Mutations made by outside code survive as long as the node is not recreated, but they are not part of the captured markup.',

  ]},
  why: 'Third-party scripts assume they own their patch of DOM. Without an opt-out, your reconciler and their jQuery plugin will fight over the same nodes, and the plugin will lose in ways that are very hard to debug.',
  examples: [
    { lbl: 'Directives inside are never processed', say: 'Same expression inside and outside. Only the outside one is live, and the inner button does nothing.', src:
`<div x-data="{ n: 0 }">
  <button @click="n++">n = <span x-text="n"></span></button>
  <div class="box" x-ignore>
    inside x-ignore: <span x-text="n">never processed</span>
    <button @click="n = 999">this button does nothing</button>
  </div>
  <div class="box on">outside: <span x-text="n"></span></div>
</div>` }
  ]
},

{

`<div x-data="{ n: 0, log: [] }"

{
  id: '$nextTick', kind: 'property', group: 'Properties', sec: 'API reference', status: 'tradeoff', name: '$nextTick',

  alpine: `<div x-text="count"
  x-init="$nextTick(() => {

  v2: `// _delayedLifecycleEvents — hooks queued during the

  v2note: 'v2\'s deferred-hook queue is the same mechanism v3 uses for lifecycle, and it is why a hook can never observe a half-updated tree.',

  })">…</div>`,
  v3note: 'Same API. Resolves after the diff commits, before the browser paints.',
  notes: { kind: 'warn', title: 'After the redraw — but before the paint', items: [
    'Callbacks queue and are drained by <code>performRedraw()</code> once the diff has committed and lifecycle hooks have run. A frame-scheduled fallback covers the case where no redraw was pending, so it always resolves.',
    '<strong>For DOM reads this is exactly right</strong> — <code>textContent</code>, <code>value</code>, geometry and structure all reflect the new state.',
    '<strong>Found while writing this deck:</strong> the first implementation used a bare <code>queueMicrotask</code>. Because a reactive write schedules its redraw on <code>requestAnimationFrame</code>, the microtask fired <em>before</em> the redraw and handed you a stale DOM — defeating the entire purpose. Now fixed, with a regression test pinning the ordering.',
    'Alpine describes its version as "the next browser paint". m.js resolves after the diff but <strong>before</strong> paint. For actual painted layout, use <code>requestAnimationFrame</code>.',
    'Returns a promise, so <code>await $nextTick()</code> works.'

{

  tagline: 'Everything in Alpine\'s core surface that m.js v3 does not do — in one place.',
  custom: `
  <div class="callout gone">
    <h4>Not implemented</h4>
    <ul>
      <li><b>x-transition staged API</b> — <code>x-transition:enter</code>, <code>:enter-start</code>,

      <li><b>x-transition on x-if</b> — leave transitions need deferred node removal, which the diff has no

      <li><b>x-bind="objectOfAttrs"</b> — the spread form. Bind attributes individually.</li>
      <li><b>Implicit <code>await</code> in expressions</b> — Alpine compiles directives to async functions;

      <li><b>x-on modifiers</b> <code>.debounce</code> <code>.throttle</code> <code>.camel</code>
      <code>.dot</code> <code>.away</code></li>

      <li><b><code>$refs</code> is empty on the first build pass.</b> Read it from handlers,
      <code>x-init</code> or <code>$nextTick</code>.</li>

      use <code>requestAnimationFrame</code> if you need the browser to have painted.</li>

      <li><b>Empty string is a value, not a removal.</b> <code>:alt="''"</code> keeps the attribute; only
      <code>null</code>/<code>undefined</code>/<code>false</code> remove it.</li>

    <ul>

      <li><b>Keyed reconciliation with LIS reordering</b> — reversing 20 rows performs 19 moves and rebuilds

      <li><b>Foreign-target listeners are tracked and torn down</b> when the element is removed.</li>
      <li><b><code>@window.resize</code></b> accepted alongside <code>@resize.window</code>.</li>

// ---------------------------------------------------------------------------
// Render
// ---------------------------------------------------------------------------
let idx = 0;
let runTimer = 0;

function labMarkup(it) {
  return `<div class="lab">
    <div class="lab-tabs">
      ${it.examples.map((e, i) => `<button class="lab-tab${i === 0 ? ' on' : ''}" data-ex="${i}"
        title="${it.id} · example ${i + 1}">
        <span class="fig">Fig ${idx + 1}.${i + 1}</span><br>${e.lbl}</button>`).join('')}
      <div class="lab-say" data-say></div>
    </div>
    <div class="lab-editor">
      <header>
        <span class="lab-head-right"><span>Edit</span>
          <span class="fig" data-fig>Fig ${idx + 1}.1</span></span>
        <span class="lab-head-right">
          <button class="reset" data-reset title="Restore the original source and restart the demo">↺ Reset</button>
        </span>
      </header>
      <div class="ed">
        <pre class="ed-hl" aria-hidden="true" data-hl></pre>
        <textarea class="ed-in" spellcheck="false" autocomplete="off"
          autocapitalize="off" data-src></textarea>
      </div>
    </div>
    <div class="lab-preview">
      <header><span>Preview</span>
        <span class="stats">
          <span class="live"><i></i>running</span>
          <span class="stat">↻ <b data-redraws>0</b> redraws</span>
          <span class="stat ops"><b data-ops>0</b> DOM ops</span>
        </span>
      </header>
      <div class="err" data-err></div>
      <iframe sandbox="allow-scripts allow-popups" data-frame></iframe>
    </div>
  </div>`;
}

function panel(cls, label, src, lang, note) {
  return `<div class="panel ${cls}">
    <header><span class="who"><span class="tick"></span>${label}</span></header>
    ${src ? code(src, lang) : '<div class="none">no equivalent</div>'}
    ${note ? `<div class="foot">${note}</div>` : ''}
  </div>`;
}

function render() {
  const it = ITEMS[idx];
  const stage = document.getElementById('stage');
  const host = document.getElementById('slidehost');
  let html = `<div class="slide">`;

  if (it.custom) {
    html += it.hideHead ? it.custom : `<div class="slide-head">
        <div class="kicker">${it.group}</div>
        <div class="title-row"><h2 class="name">${it.name}</h2></div>
        <p class="tagline">${it.tagline}</p>
      </div>${it.custom}`;
    if (it.examples && it.examples.length) html += labMarkup(it);
  } else {
    const peers = ITEMS.filter((x) => x.group === it.group);
    const sig = it.name.startsWith('$') ? `<span class="sigil">$</span>${it.name.slice(1)}` : it.name;
    html += `<div class="slide-head">
        <div class="kicker">${it.kind} · ${peers.indexOf(it) + 1} of ${peers.length}</div>
        <div class="title-row">
          <h2 class="name">${sig}</h2>
          <span class="pill ${it.status}">${S[it.status]}</span>
        </div>
        <p class="tagline">${it.tagline}</p>
      </div>
      <div class="cols">
        ${panel('alpine', 'Alpine.js', it.alpine)}
        ${panel('v3', 'm.js v3', it.v3, null, it.v3note)}
      </div>
      <div class="cols">${panel('v2', 'm.js v2 — how you would have done it', it.v2, 'js', it.v2note)}</div>`;

    if (it.notes) {
      html += `<div class="callout ${it.notes.kind}"><h4>${it.notes.title}</h4>
        <ul>${it.notes.items.map((i) => `<li>${i}</li>`).join('')}</ul></div>`;
    }
    html += `<div class="why"><h4>Why it matters</h4><p>${it.why}</p></div>`;

    if (it.examples && it.examples.length) html += labMarkup(it);
  }

  html += `</div>`;
  host.innerHTML = html;
  const sig = it.name.startsWith('$')
    ? `<span class="sigil">$</span>${it.name.slice(1)}`
    : it.name;
  document.getElementById('pin').innerHTML = it.hideHead ? '' :
    `<div class="kicker">${it.custom ? it.group : `${it.kind} · ${
      ITEMS.filter((x) => x.group === it.group).indexOf(it) + 1} of ${
      ITEMS.filter((x) => x.group === it.group).length}`}</div>
     <h2>${sig}</h2>
     ${it.status === 'meta' ? '' : `<span class="pill ${it.status}">${S[it.status]}</span>`}
     <span class="pintag">${it.tagline}</span>`;
  stage.scrollTop = 0;
  stage.focus({ preventScroll: true });
  measureHead();

  if (it.examples && it.examples.length) wireLab(it);
  wireCopy();

  document.querySelectorAll('.nav-item').forEach((b, i) => b.classList.toggle('on', i === idx));
  const activeBtn = document.querySelectorAll('.nav-item')[idx];
  const box = activeBtn?.closest('.nav-group');
  if (box?.classList.contains('hidden')) {
    box.classList.remove('hidden');
    box.previousElementSibling?.classList.remove('closed');
  }
  document.querySelector('#bar > i').style.width = ((idx + 1) / ITEMS.length) * 100 + '%';
  document.getElementById('cur').textContent = idx + 1;
  const prevBtn = document.getElementById('prev');
  const nextBtn = document.getElementById('next');
  prevBtn.hidden = idx === 0;
  nextBtn.hidden = !ITEMS.slice(idx + 1).some((x) => !x.external);
  const on = document.querySelectorAll('.nav-item')[idx];
  if (on) on.scrollIntoView({ block: 'nearest', inline: 'nearest' });
  location.hash = it.id;
}

function wireLab(it) {
  const ta = document.querySelector('[data-src]');
  const out = document.querySelector('[data-hl]');
  const frame = document.querySelector('[data-frame]');
  const say = document.querySelector('[data-say]');
  const err = document.querySelector('[data-err]');
  const resetBtn = document.querySelector('[data-reset]');
  const figEl = document.querySelector('[data-fig]');
  let cur = 0;

  const markDirty = () => resetBtn.classList.toggle(
    'dirty', ta.value !== it.examples[cur].src.trim());

  // The <pre> is scrolled to match the textarea. Scrolling a <code> child does
  // nothing — it is not the scroll container — which is why the highlighted
  // text used to sit still while only the caret moved.
  const sync = () => {
    out.scrollTop = ta.scrollTop;
    out.scrollLeft = ta.scrollLeft;
  };
  const paint = () => {
    // trailing newline keeps the final line visible under the caret
    out.innerHTML = hlHtml(ta.value + '\n');
    sync();
  };

  const run = () => {
    err.classList.remove('on');
    err.textContent = '';
    setStats(0, 0);
    frame.srcdoc = demoDoc(ta.value);
  };

  const schedule = () => { clearTimeout(runTimer); runTimer = setTimeout(run, 400); };

  const load = (i) => {
    cur = i;
    ta.value = it.examples[i].src.trim();
    say.innerHTML = it.examples[i].say || '';
    figEl.textContent = `Fig ${idx + 1}.${i + 1}`;
    document.querySelectorAll('.lab-tab').forEach((b, j) => b.classList.toggle('on', j === i));
    markDirty();
    paint();
    run();
  };

  document.querySelectorAll('.lab-tab').forEach((b) =>
    b.addEventListener('click', () => load(+b.dataset.ex)));

  resetBtn.addEventListener('click', () => load(cur));

  ta.addEventListener('input', () => { paint(); markDirty(); schedule(); });
  ta.addEventListener('scroll', sync);
  ta.addEventListener('keydown', (e) => {
    if (e.key !== 'Tab') return;
    e.preventDefault();
    const s = ta.selectionStart, t = ta.selectionEnd;
    ta.value = ta.value.slice(0, s) + '  ' + ta.value.slice(t);
    ta.selectionStart = ta.selectionEnd = s + 2;
    paint();
    markDirty();
    schedule();
  });

  load(0);
}

function wireCopy() {
  const btn = document.querySelector('[data-copy]');
  const src = document.querySelector('[data-cdn]');
  if (!btn || !src) return;
  btn.addEventListener('click', async () => {
    const url = src.textContent.trim();
    try {
      await navigator.clipboard.writeText(url);
    } catch (_) {
      // file:// and insecure origins have no clipboard — select it instead
      const r = document.createRange();
      r.selectNodeContents(src);
      const sel = getSelection();
      sel.removeAllRanges();
      sel.addRange(r);
    }
    btn.textContent = 'Copied';
    btn.classList.add('ok');
    setTimeout(() => { btn.textContent = 'Copy'; btn.classList.remove('ok'); }, 1600);
  });
}

function setStats(redraws, ops) {
  const r = document.querySelector('[data-redraws]');
  const o = document.querySelector('[data-ops]');
  if (r) r.textContent = redraws;
  if (o) o.textContent = ops;
}

addEventListener('message', (ev) => {
  const d = ev.data;
  if (!d || d.source !== 'm-doc') return;
  const frame = document.querySelector('[data-frame]');
  if (!frame || ev.source !== frame.contentWindow) return;
  // A torn-down iframe can post one last message while frame.contentWindow
  // still resolves to it — ignore anything from a superseded run.
  if (d.run !== undefined && d.run !== runToken) return;
  if (d.type === 'stats') return setStats(d.redraws, d.ops);
  if (d.type === 'error') {
    const err = document.querySelector('[data-err]');
    if (err) { err.textContent = '⚠ ' + d.message; err.classList.add('on'); }
  }
});

function buildNav() {
  const nav = document.getElementById('nav');
  let group = null;
  let sec = null;
  ITEMS.forEach((it, i) => {
    if (it.sec !== sec) {
      sec = it.sec;
      if (sec) {
        const d = document.createElement('div');
        d.className = 'nav-sec';
        d.textContent = sec;
        nav.appendChild(d);
      }
    }
    if (it.group !== group) {
      group = it.group;
      const n = ITEMS.filter((x) => x.group === group && x.kind !== 'meta').length;
      const lbl = document.createElement('div');
      lbl.className = 'group-label';
      lbl.innerHTML = `<span class="caret">▼</span>${group}${n ? ` · ${n}` : ''}`;
      const box = document.createElement('div');
      box.className = 'nav-group';
      // Collapsible so a 30-entry sidebar stays navigable; the group holding
      // the current slide is force-opened by render().
      lbl.onclick = () => {
        const closed = box.classList.toggle('hidden');
        lbl.classList.toggle('closed', closed);
      };
      nav.appendChild(lbl);
      nav.appendChild(box);
    }
    const host = nav.lastElementChild;
    // External entries are plain links — they leave the deck.
    const b = document.createElement(it.external ? 'a' : 'button');
    b.className = 'nav-item';
    b.innerHTML = `<span class="dot ${it.status}"></span>${it.name}` +
      (it.external ? '<span class="ext">↗</span>' : '');
    if (it.external) {
      b.href = it.external;
      b.target = '_blank';
      b.rel = 'noopener';
    } else {
      b.onclick = () => { idx = i; render(); };
    }
    host.appendChild(b);
  });
  document.getElementById('tot').textContent = ITEMS.length;
}

// Show the pinned bar once the real header has scrolled out of view.
let pinAfter = 0;

function measureHead() {
  const head = document.querySelector('.slide-head');
  const pin = document.getElementById('pin');
  pinAfter = head ? head.offsetTop + head.offsetHeight - 12 : Infinity;
  pin.classList.remove('on');
}

document.getElementById('stage').addEventListener('scroll', function () {
  document.getElementById('pin').classList.toggle('on', this.scrollTop > pinAfter);
}, { passive: true });

const go = (d) => {
  let n = idx;
  do { n += d; } while (ITEMS[n] && ITEMS[n].external);
  if (n < 0 || n >= ITEMS.length) return;
  idx = n;
  render();
};
document.getElementById('prev').onclick = () => go(-1);
document.getElementById('next').onclick = () => go(1);
addEventListener('keydown', (e) => {
  const t = e.target.tagName;
  if (t === 'INPUT' || t === 'TEXTAREA') return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === 'ArrowRight') { e.preventDefault(); go(1); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); go(-1); }
  else if (e.key === '[') { idx = 0; render(); }
  else if (e.key === ']') { idx = ITEMS.length - 1; render(); }
});

// Deep links, in-page anchors (the home CTAs) and browser back/forward all
// arrive as a hash change. render() writes the same hash, so the echo is a
// no-op rather than a loop.
addEventListener('hashchange', () => {
  const i = ITEMS.findIndex((x) => x.id === location.hash.slice(1));
  if (i >= 0 && i !== idx) { idx = i; render(); }
});

const shell = document.getElementById('shell');
const railToggle = document.getElementById('railtoggle');
const setRail = (closed) => {
  shell.classList.toggle('railclosed', closed);
  railToggle.setAttribute('aria-expanded', String(!closed));
  try { localStorage.mjsRailClosed = closed ? '1' : ''; } catch (_) {}
};
railToggle.addEventListener('click', () =>
  setRail(!shell.classList.contains('railclosed')));
try { if (localStorage.mjsRailClosed === '1') setRail(true); } catch (_) {}

buildNav();
const fromHash = ITEMS.findIndex((i) => i.id === location.hash.slice(1));
if (fromHash >= 0) idx = fromHash;
render();
</script>
</body>
</html>
